<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow">
<title>Trailer</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
  #bar{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;gap:14px;padding:0 14px;background:#000;z-index:2}
  #back{font-size:18px;font-weight:600;color:#fff;background:#e50914;border:0;border-radius:8px;padding:11px 20px;flex:none}
  #t{font-size:17px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #wrap{position:fixed;top:60px;left:0;right:0;bottom:0}
  #wrap iframe{width:100%;height:100%;border:0;display:block}
  #msg{position:fixed;top:60px;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;font-size:19px;padding:20px}
  #msg a{color:#fff;font-size:17px}
</style>
</head>
<body>
<div id="bar"><button id="back" onclick="history.back()">← Zurück zur Mediathek</button><span id="t"></span></div>
<div id="wrap"><div id="player"></div></div>
<div id="msg"><div>Dieser Trailer darf hier leider nicht abgespielt werden.</div>
  <button id="back2" onclick="history.back()" style="font-size:18px;font-weight:600;color:#fff;background:#e50914;border:0;border-radius:8px;padding:12px 22px">← Zurück zur Mediathek</button></div>
<script>
  var p = new URLSearchParams(location.search);
  var ids = (p.get('v') || '').split(',').filter(function (x) { return /^[A-Za-z0-9_-]{11}$/.test(x); });
  var title = p.get('t') || '';
  document.getElementById('t').textContent = title;
  var n = 0, player = null;

  function fail() {
    document.getElementById('wrap').style.display = 'none';
    document.getElementById('msg').style.display = 'flex';
  }
  function next() {
    n++;
    if (n < ids.length) player.loadVideoById(ids[n]); else fail();
  }
  if (!ids.length) { fail(); }
  else {
    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = fail;
    document.head.appendChild(s);
  }
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('player', {
      host: 'https://www.youtube-nocookie.com',
      videoId: ids[0],
      width: '100%', height: '100%',
      playerVars: { autoplay: 1, rel: 0, playsinline: 1, fs: 1, origin: location.origin },
      events: {
        onReady: function (e) { try { e.target.playVideo(); } catch (x) {} },
        onError: next   /* gesperrt / nicht verfügbar → nächsten Trailer probieren */
      }
    });
  };
</script>
</body>
</html>
